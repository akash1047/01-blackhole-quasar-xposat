<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Radii around a non-spinning black hole</title>
  <desc id="desc">Concentric circles: event horizon at Rs, photon sphere at 1.5 Rs, innermost stable circular orbit at 3 Rs.</desc>
  <rect width="920" height="420" fill="#0b1220"/>
  <text x="460" y="36" text-anchor="middle" fill="#e8eef8" font-family="Georgia, serif" font-size="20">Non-spinning (Schwarzschild) black hole — characteristic radii</text>
  <text x="460" y="58" text-anchor="middle" fill="#9aa7bd" font-family="system-ui, sans-serif" font-size="12">Rs = 2GM/c² ≈ 3 km × (M / M☉). Spinning (Kerr) holes shrink these radii toward the horizon.</text>

  <!-- circles, scaled so 3 Rs = 135 px radius -->
  <g transform="translate(250,230)">
    <circle r="135" fill="none" stroke="#3d8bfd" stroke-width="2.5" stroke-dasharray="7 5"/>
    <circle r="67.5" fill="none" stroke="#f0c14a" stroke-width="2.5" stroke-dasharray="4 4"/>
    <circle r="45" fill="#000" stroke="#ff6b4a" stroke-width="3"/>
    <circle r="6" fill="#1a0a0a"/>
    <text x="0" y="4" text-anchor="middle" fill="#c9d4e5" font-size="11" font-family="system-ui, sans-serif">singularity</text>
    <text x="0" y="-52" text-anchor="middle" fill="#ff8a70" font-size="12" font-family="system-ui, sans-serif">event horizon  Rs</text>
    <text x="0" y="-78" text-anchor="middle" fill="#f0c14a" font-size="12" font-family="system-ui, sans-serif">photon sphere  1.5 Rs</text>
    <text x="0" y="-148" text-anchor="middle" fill="#7eb6ff" font-size="12" font-family="system-ui, sans-serif">ISCO  3 Rs</text>
  </g>

  <g font-family="system-ui, sans-serif" fill="#d5deeb">
    <rect x="470" y="96" width="410" height="268" rx="10" fill="#121a2b" stroke="#2a3a56"/>
    <text x="490" y="128" fill="#ff8a70" font-size="15" font-weight="600">Event horizon (Rs)</text>
    <text x="490" y="148" font-size="13">Point of no return. Even light cannot climb out.</text>
    <text x="490" y="184" fill="#f0c14a" font-size="15" font-weight="600">Photon sphere (1.5 Rs)</text>
    <text x="490" y="204" font-size="13">Unstable circular orbit for light. Sets the</text>
    <text x="490" y="222" font-size="13">bright ring around the black-hole shadow.</text>
    <text x="490" y="258" fill="#7eb6ff" font-size="15" font-weight="600">ISCO (3 Rs)</text>
    <text x="490" y="278" font-size="13">Innermost stable circular orbit for matter.</text>
    <text x="490" y="296" font-size="13">A thin accretion disk typically ends here;</text>
    <text x="490" y="314" font-size="13">inside it, gas plunges toward the horizon.</text>
    <text x="490" y="344" fill="#9aa7bd" font-size="12">Most of the light we see is produced outside the horizon.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="t d">
  <title id="t">Where AGN X-rays come from</title>
  <desc id="d">Disk seed photons, Compton upscattering in a corona, and reflection off the disk including iron K-alpha and the Compton hump.</desc>
  <rect width="980" height="420" fill="#0b1220"/>
  <text x="490" y="32" text-anchor="middle" fill="#e8eef8" font-family="Georgia, serif" font-size="20">X-rays from the inner engine — three pieces</text>
  <text x="490" y="54" text-anchor="middle" fill="#9aa7bd" font-family="system-ui, sans-serif" font-size="12">Not to scale. Energies in keV are typical of AGN and Galactic compact objects.</text>

  <!-- disk -->
  <ellipse cx="220" cy="230" rx="150" ry="28" fill="#f0a03a" stroke="#ffe08a" stroke-width="1.5"/>
  <ellipse cx="220" cy="230" rx="48" ry="9" fill="#fff4c8"/>
  <circle cx="220" cy="230" r="12" fill="#000" stroke="#ff6b4a" stroke-width="2"/>
  <!-- corona -->
  <ellipse cx="220" cy="188" rx="42" ry="18" fill="#cfe8ff" opacity="0.55"/>
  <ellipse cx="220" cy="188" rx="42" ry="18" fill="none" stroke="#9ee2ff" stroke-width="2"/>

  <!-- arrows: UV up, X-ray down -->
  <path d="M250 210 L310 150" stroke="#ffe08a" stroke-width="3" fill="none" marker-end="url(#arrY)"/>
  <path d="M250 175 L330 120" stroke="#9ee2ff" stroke-width="3" fill="none" marker-end="url(#arrB)"/>
  <path d="M190 175 L130 120" stroke="#9ee2ff" stroke-width="3" fill="none" marker-end="url(#arrB)"/>
  <path d="M255 195 L340 250" stroke="#7dffb3" stroke-width="3" fill="none" marker-end="url(#arrG)"/>

  <defs>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ffe08a"/></marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ee2ff"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7dffb3"/></marker>
  </defs>

  <text x="220" y="290" text-anchor="middle" fill="#e8eef8" font-family="Georgia, serif" font-size="15">1. Geometry</text>
  <text x="220" y="312" text-anchor="middle" fill="#9aa7bd" font-family="system-ui, sans-serif" font-size="12">Disk UV → corona → X-rays</text>
  <text x="220" y="330" text-anchor="middle" fill="#9aa7bd" font-family="system-ui, sans-serif" font-size="12">Some X-rays hit the disk (reflection)</text>
  <text x="348" y="112" fill="#9ee2ff" font-family="system-ui, sans-serif" font-size="12">direct X-rays</text>
  <text x="348" y="268" fill="#7dffb3" font-family="system-ui, sans-serif" font-size="12">reflected</text>

  <!-- spectrum sketch -->
  <rect x="480" y="90" width="460" height="250" rx="8" fill="#121a2c" stroke="#2a3a55"/>
  <text x="710" y="118" text-anchor="middle" fill="#e8eef8" font-family="Georgia, serif" font-size="15">2. Spectrum (schematic)</text>

  <!-- axes -->
  <line x1="530" y1="300" x2="900" y2="300" stroke="#9aa7bd" stroke-width="1.5"/>
  <line x1="530" y1="300" x2="530" y2="140" stroke="#9aa7bd" stroke-width="1.5"/>
  <text x="715" y="328" text-anchor="middle" fill="#9aa7bd" font-family="system-ui, sans-serif" font-size="12">energy →  (soft)  1 keV     6.4     20+  (hard)</text>
  <text x="518" y="220" text-anchor="middle" fill="#9aa7bd" font-family="system-ui, sans-serif" font-size="12" transform="rotate(-90 518 220)">flux</text>

  <!-- power law -->
  <path d="M545 165 L880 255" stroke="#9ee2ff" stroke-width="3" fill="none"/>
  <!-- iron line bump -->
  <path d="M700 210 C712 150, 728 150, 740 210" stroke="#ffe08a" stroke-width="3" fill="none"/>
  <!-- Compton hump -->
  <path d="M780 235 C820 195, 860 200, 890 250" stroke="#7dffb3" stroke-width="3" fill="none"/>

  <text x="600" y="155" fill="#9ee2ff" font-family="system-ui, sans-serif" font-size="12">power-law (corona)</text>
  <text x="708" y="142" fill="#ffe08a" font-family="system-ui, sans-serif" font-size="12">Fe Kα</text>
  <text x="800" y="188" fill="#7dffb3" font-family="system-ui, sans-serif" font-size="12">Compton hump</text>

  <text x="490" y="400" text-anchor="middle" fill="#6b7789" font-family="system-ui, sans-serif" font-size="11">Teaching diagram, not a fitted spectrum.</text>
</svg>
